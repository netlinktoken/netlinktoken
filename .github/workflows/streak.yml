name: Generate Streak Stats

on:
  schedule:
    - cron: '0 0 * * *'   # tiap hari jam 00:00 UTC
  workflow_dispatch:        # bisa jalan manual dari tab Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate streak SVG
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          user_id: netlinktoken
          output: assets/streak-stats.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats"
          git push
